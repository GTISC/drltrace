name: Build

on: 
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - 'drltrace_src/**'
      - '.github/workflows/build.yaml'

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Setup Cygwin
      uses: cygwin/cygwin-install-action@master
      with:
        packages: perl
        
    - name: Setup VS Dev Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup CMake 3.31.8
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.31.8'
        
    - name: Configure CMake
      run: cmake -B build -S drltrace_src -G "Visual Studio 17 2022" -A X64 -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="/WX- /wd5286" -DCMAKE_CXX_FLAGS="/WX- /wd5286"
      
    - name: Build
      run: | 
        $env:CL="/wd5286"
        cmake --build build --verbose -- /p:CLToolAdditionalOptions="/wd5286"
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: drltrace-windows-build
        path: build/
        retention-days: 7